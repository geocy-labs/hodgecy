[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hodgecy"
version = "1.0.0"
description = "Computational Hodge and Calabi--Yau data-system infrastructure for HodgeCY."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "A. Rahman", email = "arahman@alum.howard.edu" }
]
dependencies = [
  "pandas>=2.0",
  "sympy>=1.12"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]
storage = [
  "duckdb>=1.0",
  "pyarrow>=15.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
